<section id="projects" class="section projects" style="background-color: var(--color-bg-secondary);">
  <div class="container reveal">
    <h2 class="text-gradient" style="text-align: center; margin-bottom: var(--spacing-xl);">Selected Projects</h2>
    <div class="projects-grid" id="projects-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--spacing-lg);">
      <!-- Example Project Card (would be populated by JS ideally) -->
      <div class="project-card glass-panel reveal reveal-delay-1" style="overflow: hidden; transition: transform var(--transition-normal);">
        <div style="height: 200px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center;">
           <span style="color: var(--color-text-secondary);">[Project Image]</span>
        </div>
        <div style="padding: var(--spacing-lg);">
          <h3 style="margin-bottom: var(--spacing-sm);">Project Alpha</h3>
          <p style="font-size: 0.9rem; margin-bottom: var(--spacing-md);">A revolutionary web application built with modern frameworks.</p>
          <a href="#" style="color: var(--color-accent); font-weight: 600; font-size: 0.9rem;">View Case Study &rarr;</a>
        </div>
      </div>
      
      <!-- Example Project Card 2 -->
      <div class="project-card glass-panel reveal reveal-delay-2" style="overflow: hidden; transition: transform var(--transition-normal);">
        <div style="height: 200px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center;">
           <span style="color: var(--color-text-secondary);">[Project Image]</span>
        </div>
        <div style="padding: var(--spacing-lg);">
          <h3 style="margin-bottom: var(--spacing-sm);">Project Beta</h3>
          <p style="font-size: 0.9rem; margin-bottom: var(--spacing-md);">An e-commerce platform with seamless user experience.</p>
          <a href="#" style="color: var(--color-accent); font-weight: 600; font-size: 0.9rem;">View Case Study &rarr;</a>
        </div>
      </div>
    </div>
  </div>
</section>
